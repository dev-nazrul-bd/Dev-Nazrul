<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dev Nazrul - Personal Sports TV</title>
    
    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.10.0/video-js.css" rel="stylesheet" />
    
    <style>
        :root {
            --primary-color: #007bff;
            --primary-hover: #0056b3;
            --bg-color: #f4f6f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --text-muted: #666666;
            --border-color: #dddddd;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Profile Section */
        .profile-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 25px;
            text-align: center;
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--primary-color);
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.2);
            margin-bottom: 10px;
        }

        .profile-name {
            font-size: 24px;
            font-weight: bold;
            margin: 5px 0;
            letter-spacing: 0.5px;
            color: var(--text-color);
        }

        /* Main Container */
        .main-container {
            width: 100%;
            max-width: 850px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.05);
            border: 1px solid var(--border-color);
            box-sizing: border-box;
        }

        h2 {
            color: var(--text-color);
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .selector-box {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 600;
        }

        select {
            background: #ffffff;
            color: var(--text-color);
            padding: 12px 15px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.15);
        }

        /* Video Player Wrapper */
        .video-wrapper {
            position: relative;
            background-color: #000000;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid var(--border-color);
        }

        .video-js {
            width: 100%;
            aspect-ratio: 16/9;
        }

        /* Action Buttons */
        .control-actions {
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }

        .fullscreen-btn {
            background: linear-gradient(135deg, var(--primary-color) 0%, var(--primary-hover) 100%);
            color: #ffffff;
            border: none;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.3);
            transition: all 0.2s ease;
        }

        .fullscreen-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 123, 255, 0.4);
        }

        .fullscreen-btn:active {
            transform: translateY(0);
        }

        /* Developer Footer */
        .developer-footer {
            margin-top: 40px;
            text-align: center;
            padding: 20px;
            border-top: 1px solid var(--border-color);
            width: 100%;
            max-width: 850px;
        }

        .developer-footer p {
            margin: 6px 0;
            font-size: 14px;
            color: var(--text-muted);
        }

        .developer-footer a {
            color: var(--primary-color);
            text-decoration: none;
            font-weight: 500;
        }
        
        .developer-footer a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Profile Section -->
    <div class="profile-container">
        <!-- আপনার অরিজিনাল ছবির নাম এখানে হুবহু বসিয়ে দেওয়া হয়েছে -->
        <img src="https://i.ibb.co.com/HTdNjg0k/profile-2.jpg" alt="Dev Nazrul" class="profile-img">
        <div class="profile-name">Md Nazrul Islam</div>
    </div>

    <!-- Main Container -->
    <div class="main-container">
        <h2>🏆 Live Match Streaming Player</h2>
        
        <div class="selector-box">
            <label for="channelSelect">Select Channel:</label>
            <select id="channelSelect" onchange="changeChannel()">
                <!-- BTV-কে ডিফল্ট সিলেক্টেড (selected) করা হয়েছে -->
                <option value="https://owrcovcrpy.gpcdn.net/bpk-tv/1709/output/index.m3u8" selected>BTV (Bangladesh Television)</option>
                <option value="http://198.195.239.50:8095/tsports/tracks-v1a1/mono.m3u8">T Sports</option>
            </select>
        </div>

        <div class="video-wrapper">
            <video id="live-player" class="video-js vjs-default-skin vjs-big-play-centered" controls preload="auto">
                <p class="vjs-no-js">To view this video please enable JavaScript, and consider upgrading to a web browser that supports HTML5 video.</p>
            </video>
        </div>

        <!-- Rotation & Fullscreen Button -->
        <div class="control-actions">
            <button class="fullscreen-btn" onclick="goFullScreenAndRotate()">
                📺 Full Screen (Rotate)
            </button>
        </div>
    </div>

    <!-- Developer Footer -->
    <div class="developer-footer">
        <p><strong>Developer Contact:</strong> Md Nazrul Islam</p>
        <p><strong>Email:</strong> <a href="mailto:dev.nazrul.bd@gmail.com">dev.nazrul.bd@gmail.com</a></p>
    </div>

    <!-- Video.js Script -->
    <script src="https://vjs.zencdn.net/8.10.0/video.min.js"></script>

    <script>
        // Player Initialization
        var player = videojs('live-player', {
            fluid: true,
            autoplay: true,
            muted: false
        });

        // Auto play the selected channel on page load
        window.onload = function() {
            changeChannel();
        };

        // Function to change channel stream
        function changeChannel() {
            var select = document.getElementById("channelSelect");
            var streamUrl = select.value;
            
            var streamType = 'application/x-mpegURL'; // HLS (.m3u8)
            if (streamUrl.endsWith('.mpd')) {
                streamType = 'application/dash+xml'; // DASH (.mpd)
            }

            player.src({
                src: streamUrl,
                type: streamType
            });
            player.load();
            
            // Trigger Auto Play
            player.play().catch(function(error) {
                console.log("Autoplay was prevented by browser. Click play manually.");
            });
        }

        // Fullscreen and Landscape Rotation Function
        function goFullScreenAndRotate() {
            var playerElement = document.getElementById('live-player');
            
            if (playerElement.requestFullscreen) {
                playerElement.requestFullscreen();
            } else if (playerElement.mozRequestFullScreen) { /* Firefox */
                playerElement.mozRequestFullScreen();
            } else if (playerElement.webkitRequestFullscreen) { /* Chrome, Safari and Opera */
                playerElement.webkitRequestFullscreen();
            } else if (playerElement.msRequestFullscreen) { /* IE/Edge */
                playerElement.msRequestFullscreen();
            }

            // Attempt to lock orientation to landscape on mobile devices
            if (screen.orientation && screen.orientation.lock) {
                screen.orientation.lock('landscape').catch(function(error) {
                    console.log("Screen orientation lock is not supported or rejected.");
                });
            }
        }
    </script>
</body>
</html>
